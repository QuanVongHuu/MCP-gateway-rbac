# Mock MCP backends: one image (mcp-mocks:dev), five Deployments + ClusterIP Services in namespace mcp.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
  namespace: mcp
  labels:
    app: radar
    role: mcp-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
        role: mcp-mock
    spec:
      containers:
      - name: radar
        image: mcp-mocks:dev
        imagePullPolicy: IfNotPresent   # image is loaded into kind, never pulled
        args: ["radar/server.py"]
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 128Mi}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: radar
  namespace: mcp
  labels:
    app: radar
spec:
  selector:
    app: radar
  ports:
  - port: 80
    targetPort: http
    appProtocol: agentgateway.dev/mcp
