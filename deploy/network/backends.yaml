apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-agentgateway-only
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      role: mcp-mock
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agentgateway-system
    ports:
    - {protocol: TCP, port: 8000}
