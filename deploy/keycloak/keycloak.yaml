apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels: 
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.2
        args:
          - start-dev
        env:
          - name: KC_HOSTNAME
            value: http://localhost:8002
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            value: admin
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: data
            mountPath: /opt/keycloak/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - name: http
      port: 80
      targetPort: 8080
