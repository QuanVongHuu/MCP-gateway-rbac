# Lets containers on Docker's `kind` network reach Keycloak at gatewayapi-control-plane:30802.
# The real OpenMetadata (compose.override.yml) fetches Keycloak's signing keys through it.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-nodeport
  namespace: keycloak
spec:
  type: NodePort
  selector: {app: keycloak}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30802
