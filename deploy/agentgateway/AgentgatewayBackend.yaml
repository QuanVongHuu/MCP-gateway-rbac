apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-backend
  namespace: mcp
spec:
  mcp:
    prefixMode: Always
    targets:
    - name: radar
      static:
        host: radar.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
    - name: spark-history
      static:
        host: spark-history.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
    - name: openmetadata
      static:
        host: openmetadata.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
    - name: dbt
      static:
        host: dbt.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
    - name: airflow
      static:
        host: airflow.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
