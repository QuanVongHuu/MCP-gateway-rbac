apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-backend
  namespace: mcp
spec:
  mcp:
    prefixMode: Always
    targets:
    - name: radar
      static:
        # the real radar (deploy/real-servers/radar). The mock is radar.mcp.svc.cluster.local port 80
        host: radar-real.mcp.svc.cluster.local
        port: 9280
        path: /mcp
        protocol: StreamableHTTP
    - name: spark-history
      static:
        # the real Spark History Server MCP in Docker (deploy/real-servers/spark-history).
        # The mock is spark-history.mcp.svc.cluster.local port 80
        host: spark-history-real
        port: 18888
        path: /mcp
        protocol: StreamableHTTP
    - name: openmetadata
      static:
        # the real OpenMetadata in Docker (deploy/real-servers/openmetadata), reached over Docker's
        # `kind` network. The mock is openmetadata.mcp.svc.cluster.local port 80
        host: openmetadata-real
        port: 8585
        path: /mcp
        protocol: StreamableHTTP
    - name: dbt
      static:
        host: dbt.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
    - name: airflow
      static:
        host: airflow.mcp.svc.cluster.local
        port: 80
        path: /mcp
        protocol: StreamableHTTP
